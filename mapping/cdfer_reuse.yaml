# Curated CDFER symbol/footprint reuse table (plan §2.1 T2, built 2026-08-09).
#
# Source: CDFER/JLCPCB-Kicad-Library hand-drawn symbols in
# symbols/JLCPCB-{Analog,ICs,Interface}.kicad_sym (MIT licensed). A part's
# pinout doesn't change because a different distributor sells it, so the
# symbol geometry (pin names/numbers/positions) and SOIC/SOP footprint
# geometry are reused as-is; only the sourcing properties (ES_PN, price,
# stock, ...) are re-pointed at the matching ES row via handmade_symbols.py.
#
# Every es_pn below was confirmed live against es.co.th on 2026-08-09 with
# a matching package (SOIC/SOP family matching the CDFER footprint's pin
# count, or PDIP mapped to KiCad's stock Package_DIP footprint instead of
# the CDFER geometry). Rows with no package-compatible ES match were
# dropped rather than guessed -- see the conversation for the full search
# results, including MPN families with zero ES hits (LMV321, MCP6002,
# CD4051/4052, 74LVC4245, PCF8563, NE555, ADUM1201, SN65HVD230, TJA1050,
# SP3232, SP3485, SP485E, CP2102, HT1621, STM32F030/F103C8,
# STM8S003F3/S105, AT24C256, M24C64/C02, LTV-217) and STM8S003 (ES has only
# the unrelated K3/LQFP-32 variant, not the F3/TSSOP-20 CDFER drew).
#
# footprint_source: "cdfer" means copy the .kicad_mod verbatim from
# footprints/JLCPCB.pretty/{cdfer_footprint}.kicad_mod into
# footprints/ES.pretty/ (Route B). "kicad_stock" means point straight at a
# KiCad-installed library (Route A), no file copy needed.

